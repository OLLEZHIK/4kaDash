<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4kaDash — Dashboard Library</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar" id="topbar" hidden>
      <a class="brand" href="#/">4kaDash</a>
      <nav class="nav" id="nav">
        <a href="#/" data-nav="library">Library</a>
        <a href="#/workspace" data-nav="workspace">My workspace</a>
        <a href="#/schedules" data-nav="schedules">Schedules</a>
        <a href="#/quality" data-nav="quality">Data quality</a>
        <a href="#/admin" data-nav="admin" id="nav-admin" hidden>Admin</a>
      </nav>
      <div class="userbox">
        <a href="#/notifications" class="bell" id="bell" title="Notifications">Notifications <span id="bell-count" class="badge" hidden></span></a>
        <span id="user-name" class="muted"></span>
        <button class="link" id="logout">Sign out</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
